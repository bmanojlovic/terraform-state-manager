name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Setup wrangler config for testing
        run: |
          cat > wrangler.toml << 'EOF'
          name = "terraform-state-manager-test"
          main = "src/index.ts"
          compatibility_date = "2024-09-25"
          compatibility_flags = ["nodejs_compat"]

          [build]
          command = "npm install && npm run build"

          [[d1_databases]]
          binding = "DB"
          database_name = "tf-state-manager-test"
          database_id = "test-db-id"
          migrations_dir = "migrations"

          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "tf-state-test"
          EOF
          sed -i 's/^          //' wrangler.toml
        
      - name: Run unit tests
        run: npm test
      
      - name: Create .dev.vars for wrangler
        run: echo "AUTH_TOKEN=${{ secrets.TEST_AUTH_TOKEN }}" > .dev.vars
      
      - name: Run D1 migrations
        run: npx wrangler d1 migrations apply tf-state-manager-test --local
      
      - name: Start wrangler dev
        run: |
          npx wrangler dev --local --port 8787 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8787 > /dev/null 2>&1 && break
            sleep 1
          done
          
      - name: Run integration tests
        run: npm run test:integration
        env:
          BASE_URL: http://localhost:8787
          AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
        
      - name: Stop wrangler
        if: always()
        run: pkill -f "wrangler dev" || true
